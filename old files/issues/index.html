      <!-- LIGHTBOX -->
      <div id="lightbox">
        <span id="lightbox-close">&#x2715;</span>
        <span id="lightbox-prev">&#8592;</span>
        <img id="lightbox-img" src="" alt="">
        <span id="lightbox-next">&#8594;</span>
        <div id="lightbox-counter"></div>
      </div>

      <script>
 

/* LIGHTBOX */
const items = Array.from(document.querySelectorAll('.grid-item img'));
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const counter = document.getElementById('lightbox-counter');
let current = 0;

function openLightbox(index) {
    current = index;
    lightboxImg.src = items[current].src;

    if (items[current].id === 'rotate') {
        lightboxImg.classList.add('rotated');
    } else {
        lightboxImg.classList.remove('rotated');
    }

    counter.textContent = (current + 1) + ' / ' + items.length;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
}

function prev() {
    current = (current - 1 + items.length) % items.length;
    openLightbox(current);
}

function next() {
    current = (current + 1) % items.length;
    openLightbox(current);
}

/* Event listeners */
items.forEach((img, i) => {
    img.parentElement.addEventListener('click', () => openLightbox(i));
});

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', prev);
document.getElementById('lightbox-next').addEventListener('click', next);

lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'Escape') closeLightbox();
});
      </script>
